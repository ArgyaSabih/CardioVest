# Tambahan untuk server produksi (alat terhubung lewat 4G/internet):
#   docker compose -f docker-compose.yml -f docker-compose.produksi.yml up -d --build
# Persiapan: mosquitto/produksi/README.md (akun + sertifikat).
services:
  mosquitto:
    ports: !override
      - "8883:8883"     # MQTT + TLS (perangkat)
      - "9443:9443"     # MQTT WebSocket + TLS (browser)
    volumes: !override
      - ./mosquitto/produksi/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/produksi/acl:/mosquitto/config/acl:ro
      - ./mosquitto/produksi/passwd:/mosquitto/config/passwd:ro
      - ./mosquitto/produksi/certs:/mosquitto/certs:ro
      - mosquitto-data:/mosquitto/data

  cloud:
    environment:
      MQTT_USER: cloud
      MQTT_PASS: ${MQTT_PASS_CLOUD:?isi MQTT_PASS_CLOUD di .env (lihat mosquitto/produksi/buat_akun.sh)}

  web:
    ports: !override []             # hanya lewat Caddy (HTTPS)
    environment:
      MQTT_USER: web
      MQTT_PASS: ${MQTT_PASS_WEB:?isi MQTT_PASS_WEB (akun web dari buat_akun.sh) di .env}
      # bila tampilan dipasang di Vercel, isi PUBLIC_URL dengan alamat Vercel di .env
      PUBLIC_URL: ${PUBLIC_URL:-https://${WEB_DOMAIN:?isi WEB_DOMAIN di .env}}

  caddy:
    image: caddy:2.8.4-alpine
    container_name: c251-caddy
    depends_on: [web]
    ports: ["80:80", "443:443"]
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN}
    volumes:
      - ./web/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    restart: unless-stopped

  # debug viewer HTTP polos tidak ikut di server; jalankan dengan --profile debug bila perlu
  viewer:
    profiles: ["debug"]

  # simulator tidak dijalankan di server produksi; aktifkan dengan --profile sim bila perlu demo
  simulator:
    profiles: ["sim"]
    environment:
      MQTT_USER: ${DEVICE_ID:-cv-001}
      MQTT_PASS: ${MQTT_PASS_SIMDEV:-}

volumes:
  caddy-data:
