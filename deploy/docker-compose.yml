name: cardiovest

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    ports:
      - "1883:1883"
      - "8883:8883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - ${DATA_ROOT}/mosquitto/passwd:/mosquitto/config/passwd:ro
      - ${DATA_ROOT}/mosquitto/conf.d:/mosquitto/config/conf.d:ro
      - ${DATA_ROOT}/mosquitto/certs:/mosquitto/certs:ro
      - ${DATA_ROOT}/mosquitto/data:/mosquitto/data
    restart: unless-stopped

  cloud:
    build:
      context: ..
      dockerfile: cloud/Dockerfile
    depends_on: [mosquitto]
    env_file: .env
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_USER: cloud
      MQTT_PASS: ${MQTT_PASS_CLOUD}
    volumes:
      - ${DATA_ROOT}/cloud:/data
    restart: unless-stopped

  server:
    build:
      context: ../server
    depends_on: [mosquitto]
    env_file: .env
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_USER: web
      MQTT_PASS: ${MQTT_PASS_WEB}
      CLOUD_DB: /cloud-data/cardiovest.db
    volumes:
      - ${DATA_ROOT}/cloud:/cloud-data
      - ${DATA_ROOT}/server:/data
    restart: unless-stopped

  simulator:
    build:
      context: ..
      dockerfile: simulator/Dockerfile
    depends_on: [mosquitto, cloud]
    env_file: .env
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_USER: ${DEVICE_ID:-cv-001}
      MQTT_PASS: ${MQTT_PASS_DEVICE}
    restart: unless-stopped

  caddy:
    image: caddy:2.8.4-alpine
    depends_on: [server]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_ROOT}/caddy:/data
    restart: unless-stopped
