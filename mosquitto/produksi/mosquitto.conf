# Broker PRODUKSI: dipakai saat alat terhubung lewat internet (mode 4G).
# Jalankan: docker compose -f docker-compose.yml -f docker-compose.produksi.yml up -d
# Persiapan sekali: mosquitto/produksi/README.md

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file      /mosquitto/config/acl

# MQTT + TLS untuk perangkat dan klien dari internet
listener 8883
protocol mqtt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key
tls_version tlsv1.2

# MQTT over WebSocket + TLS (wss://) untuk debug viewer / web di browser
listener 9443
protocol websockets
# libwebsockets gagal diam-diam bila host tidak punya IPv6 (umum di VPS); paksa IPv4
socket_domain ipv4
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key
tls_version tlsv1.2

# MQTT polos HANYA untuk container di jaringan docker yang sama (layanan cloud, gateway web).
# Port ini sengaja tidak dipublikasikan ke host di docker-compose.produksi.yml.
listener 1883
protocol mqtt

# Batas sederhana supaya satu klien nakal tidak menghabiskan memori broker
max_inflight_messages 40
max_queued_messages 2000
max_packet_size 65536
