# Konfigurasi broker untuk PENGEMBANGAN LOKAL.
# Produksi (BAB 6.2 / F-BE-1): TLS 1.2+ di port 8883 + autentikasi per perangkat.
# Lihat blok contoh di bagian bawah.

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# MQTT TCP (perangkat simulator, layanan cloud, monitor)
listener 1883
protocol mqtt

# MQTT over WebSocket (debug viewer di browser / website nanti)
listener 9001
protocol websockets
# libwebsockets gagal diam-diam bila host tidak punya IPv6 (umum di VPS); paksa IPv4
socket_domain ipv4

allow_anonymous true

# ---------------------------------------------------------------- contoh produksi
# listener 8883
# protocol mqtt
# cafile   /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile  /mosquitto/certs/server.key
# tls_version tlsv1.2
# allow_anonymous false
# password_file /mosquitto/config/passwd
# acl_file      /mosquitto/config/acl
